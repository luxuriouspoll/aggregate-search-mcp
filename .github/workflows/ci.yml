name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: selftest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖（可编辑安装）
        run: python -m pip install -e .

      - name: 导入校验
        run: python -c "import aggregate_search, aggregate_search.server, aggregate_search.cli; print('import ok', aggregate_search.__version__)"

      - name: 命令行版本
        run: python -m aggregate_search --version

      - name: 离线自测（不联网、不读本机配置）
        run: python -m aggregate_search selftest

      - name: 离线评测快照重放
        run: python scripts/eval_search.py --output eval-run.tmp --compare evals/baseline-0.5.2.json

  package:
    name: 构建并校验发行包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 离线测试归档检查器
        run: python -I -B -m unittest discover -s scripts -p test_check_dist.py

      - name: 安装构建工具
        run: python -m pip install build

      # build 默认先构建 sdist，再从该 sdist 构建 wheel。
      - name: 构建 sdist 与 wheel
        run: python -m build --outdir dist

      - name: 校验两个发行包
        run: python -I scripts/check_dist.py dist
