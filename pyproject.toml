[project]
name = "aggregate-search-mcp"
dynamic = ["version"]
description = "免费优先的多源聚合联网搜索 MCP：集成 19 家国内外搜索源，支持零 Key 匿名起跑、覆盖度门禁自动补搜、多 Key 轮换防超支、跨源去重与正文抓取"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "mcp-server", "web-search", "search", "tavily", "exa", "perplexity", "llm", "ai-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "mcp>=1.2.0,<2",  # 2.x 把 FastMCP 改名为 MCPServer，v1 API 最稳定、文档最全
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/luxuriouspoll/aggregate-search-mcp"
Documentation = "https://github.com/luxuriouspoll/aggregate-search-mcp/blob/master/docs/usage-guide.md"
Changelog = "https://github.com/luxuriouspoll/aggregate-search-mcp/blob/master/CHANGELOG.md"
Repository = "https://github.com/luxuriouspoll/aggregate-search-mcp"
Issues = "https://github.com/luxuriouspoll/aggregate-search-mcp/issues"

[project.scripts]
# 两个名字指向同一个入口：aggregate-search 是日常用的命令；
# aggregate-search-mcp 与包名相同，方便 `uvx aggregate-search-mcp` 这类写法。
aggregate-search = "aggregate_search.cli:main"
aggregate-search-mcp = "aggregate_search.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# templates 里只有配置模板，没有代码；列在这里是为了让它随包一起安装
packages = ["aggregate_search", "aggregate_search.providers", "aggregate_search.templates"]

[tool.setuptools.dynamic]
version = { attr = "aggregate_search.__version__" }

[tool.setuptools.package-data]
aggregate_search = ["templates/env.example", "templates/keys.example.json"]
